services:
  cowrie:
    image: cowrie/cowrie:latest
    container_name: cowrie
    restart: unless-stopped
    ports:
      # Cowrie écoute sur 2222/2223 dans le conteneur ; on l'expose sur les vrais
      # ports 22 (SSH) et 23 (Telnet), ceux que les bots scannent.
      # Le vrai SSH du VPS doit donc être déplacé sur un autre port (voir README).
      - "22:2222"
      - "23:2223"
    environment:
      COWRIE_TELNET_ENABLED: "yes"
      COWRIE_OUTPUT_JSONLOG_ENABLED: "true"
    volumes:
      - cowrie-var:/cowrie/cowrie-git/var

  panel:
    build: ./panel
    container_name: cowrie-panel
    restart: unless-stopped
    depends_on:
      - cowrie
    ports:
      # Le panel n'écoute que sur 127.0.0.1 (Docker contourne UFW) : accès par tunnel SSH.
      - "127.0.0.1:8080:8080"
    volumes:
      - cowrie-var:/data:ro

volumes:
  cowrie-var:
