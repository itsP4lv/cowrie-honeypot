<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Statut des services</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📡</text></svg>">
<link rel="stylesheet" href="/static/app.css"></head><body data-page="status">

<header class="top">
 <div class="brand">
  <a class="back" href="/" title="Retour à l'accueil" aria-label="Retour à l'accueil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></a>
  <div class="logo" style="background:linear-gradient(135deg,var(--info),var(--vio))">📡</div>
  <div><h1>Statut des services</h1><p id="st-sub">Vérification toutes les minutes depuis le serveur</p></div>
 </div>
 <div class="actions">
  <span class="status" id="status"><i></i><span id="live">connexion…</span></span>
  <button class="btn icon" id="theme" title="Changer de thème"></button>
 </div>
</header>

<main class="portal">
 <section class="card st-banner" id="banner"></section>
 <section class="st-list" id="targets"></section>
</main>
<footer class="foot">En ligne : réponse HTTP 2xx/3xx ou port TCP ouvert · Lent : plus de 3 s ou réponse 4xx · Hors ligne : erreur 5xx, délai dépassé ou connexion impossible. Barres : 30 min chacune, sur 24 h.</footer>

<script src="/static/portal.js" defer></script></body></html>
